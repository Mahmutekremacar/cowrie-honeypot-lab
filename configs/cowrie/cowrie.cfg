# /opt/cowrie/etc/cowrie.cfg
#
# Operator-Override für Cowrie 3.0.15 (pip-Installation, State-Verzeichnis /opt/cowrie).
# Es werden nur die Werte gesetzt, die von den mitgelieferten Defaults abweichen.
#
# Finaler, verifizierter Zustand (Phase 1):
#   - SSH-Honeypot auf öffentlichem TCP/22 (IPv4)
#   - Telnet deaktiviert
#   - emulierter Hostname "web01" -> die Shell "root@web01" ist Cowrie, NICHT das echte VPS-Betriebssystem
#
# Hinweis: Während des Aufbaus lief Cowrie zunächst auf tcp:2222 (nur lokal getestet,
# Port 2222 war per UFW nie öffentlich freigegeben). Der Wechsel auf Port 22 erfolgte erst,
# nachdem der echte OpenSSH-Dienst auf TCP/22222 (nur über Tailscale) verschoben war.
#
# Datei-Rechte auf dem VPS: owner cowrie:cowrie, Modus 0640

[honeypot]
sensor_name = honeypot-vps
hostname = web01
timezone = UTC

[ssh]
enabled = true
listen_endpoints = tcp:22:interface=0.0.0.0

[telnet]
enabled = false
