# /etc/systemd/system/ssh.socket.d/honeypot-admin.conf  (VPS)
#
# Ubuntu 24.04 startet OpenSSH per systemd Socket Activation: Nicht sshd, sondern
# ssh.socket hält den Listening-Socket. Eine reine Änderung von "Port" in
# sshd_config reicht daher nicht, um den echten SSH-Dienst zu verschieben.
#
# Das leere "ListenStream=" löscht die geerbten Listener (0.0.0.0:22 und [::]:22)
# aus /usr/lib/systemd/system/ssh.socket. Danach werden IPv4 und IPv6 auf 22222
# EXPLIZIT gesetzt.
#
# Fehlschlag im ersten Versuch: Mit nur "ListenStream=22222" entstand ausschließlich
# ein Listener auf [::]:22222. Weil die Basis-Unit "BindIPv6Only=ipv6-only" setzt,
# nahm dieser Socket keine IPv4-Verbindungen an -> SSH über die IPv4-Tailscale-Adresse
# ergab "Connection refused".
#
# Bewusste Entscheidung: Bind auf alle Adressen statt nur auf die Tailscale-IP.
# Ein Bind an die Tailscale-IP könnte beim Booten scheitern, falls ssh.socket vor
# tailscaled startet. Die Netzwerk-Einschränkung übernimmt UFW:
#   22222/tcp nur "in on tailscale0" von <ADMIN_TAILSCALE_IP>.
#
# Anwenden: systemctl daemon-reload && systemctl restart ssh.socket
# (bestehende SSH-Sitzung dabei offen lassen!)

[Socket]
ListenStream=
ListenStream=0.0.0.0:22222
ListenStream=[::]:22222
