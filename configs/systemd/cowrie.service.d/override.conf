# /etc/systemd/system/cowrie.service.d/override.conf  (VPS)
#
# Erlaubt NUR diesem Dienst das Binden privilegierter Ports (< 1024), damit
# Cowrie als unprivilegierter User "cowrie" auf TCP/22 lauschen kann.
#
# Bewusst NICHT gewählt: `setcap cap_net_bind_service=+ep` auf den Python-Interpreter.
# Das würde die Capability global an eine Binary heften, die auch andere Programme
# nutzen können. Hier gilt sie nur für den von systemd gestarteten Cowrie-Prozess.
#
# CapabilityBoundingSet begrenzt den Prozess zusätzlich auf genau diese eine
# Capability – insbesondere besitzt Cowrie KEIN CAP_NET_ADMIN und kann damit die
# Firewall-Regeln (UID-basiertes Egress-Blocking) nicht verändern.
#
# Angelegt per `tee` statt `systemctl edit`; danach: systemctl daemon-reload && systemctl restart cowrie

[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
