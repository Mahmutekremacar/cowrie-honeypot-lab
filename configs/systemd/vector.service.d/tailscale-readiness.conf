# /etc/systemd/system/vector.service.d/tailscale-readiness.conf  (VPS)
#
# Behebt einen beim Reboot-Test beobachteten Boot-Race:
#   Vector startete, bevor die Tailscale-Route zum Home-Server nutzbar war.
#   Der Verbindungsaufbau lief über das öffentliche Interface
#   (<HONEYPOT_PUBLIC_IP> -> <WAZUH_TAILSCALE_IP>:6514) und blieb in SYN-SENT hängen.
#   Ein bereits angelegter Socket wechselt nicht nachträglich auf tailscale0.
#   (Da der Handshake nie zustande kam, wurden dabei keine Nutzdaten übertragen.)
#
# After=/Wants= regeln nur die Startreihenfolge, garantieren aber nicht, dass
# Tailscale bereits Konnektivität hat. Deshalb prüft ExecStartPre aktiv, ob die
# Zieladresse über tailscale0 geroutet wird (max. ca. 60 s), bevor Vector startet.
# Scheitert die Prüfung, startet systemd Vector nach 5 s erneut.
#
# Verifiziert nach erneutem Reboot:
#   ip route get <WAZUH_TAILSCALE_IP>  -> dev tailscale0 src <HONEYPOT_TAILSCALE_IP>
#   ss -tnp                            -> ESTAB <HONEYPOT_TAILSCALE_IP>:x -> <WAZUH_TAILSCALE_IP>:6514
#
# Platzhalter: <WAZUH_TAILSCALE_IP>

[Unit]
Wants=network-online.target tailscaled.service
After=network-online.target tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do /usr/sbin/ip route get <WAZUH_TAILSCALE_IP> 2>/dev/null | /usr/bin/grep -q "dev tailscale0" && exit 0; sleep 2; done; echo "Tailscale route to Wazuh not ready" >&2; exit 1'
Restart=on-failure
RestartSec=5
