# /etc/ssh/sshd_config.d/00-honeypot-hardening.conf  (VPS)
#
# Härtung des ECHTEN OpenSSH-Dienstes (Administration).
# Präfix "00-": OpenSSH übernimmt für diese Optionen den zuerst gefundenen Wert.
# So kann eine später eingelesene Cloud-init-Datei die Härtung nicht überschreiben.
#
# Ausgangszustand des OVH-Images (verifiziert mit `sshd -T`):
#   permitrootlogin without-password, passwordauthentication yes
#
# Reihenfolge der Umsetzung:
#   1. dedizierten Ed25519-Key erzeugen und hinterlegen
#   2. Key-only-Login in einer ZWEITEN Sitzung testen
#   3. erst dann diese Datei aktivieren (sshd -t; systemctl reload ssh)
#
# Verifiziert (sshd -T):
#   permitrootlogin no / pubkeyauthentication yes /
#   passwordauthentication no / kbdinteractiveauthentication no

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
